name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Check text formatting
        run: python scripts/dev_checks.py --all

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests
